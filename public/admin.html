<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MagToDrive - Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0f;
            --card-bg: #14141f;
            --card-border: rgba(187, 134, 252, 0.08);
            --text-color: #e0e0e0;
            --text-muted: #8888a0;
            --accent-color: #bb86fc;
            --accent-glow: rgba(187, 134, 252, 0.25);
            --secondary-color: #03dac6;
            --danger-color: #cf6679;
            --danger-glow: rgba(207, 102, 121, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        .header h1 {
            color: var(--accent-color);
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header a {
            color: var(--secondary-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .header a:hover {
            text-decoration: underline;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #fff;
        }

        /* Forms */
        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 14px;
            background-color: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .btn {
            background: linear-gradient(135deg, var(--secondary-color), #00b4a0);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(3, 218, 198, 0.3);
        }

        .btn-danger {
            background: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 6px 12px;
            font-size: 0.8rem;
        }

        .btn-danger:hover {
            background: var(--danger-color);
            color: #000;
            box-shadow: 0 2px 10px var(--danger-glow);
        }

        /* Login view */
        #loginView {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60vh;
        }

        #loginView .card {
            width: 100%;
            max-width: 400px;
        }

        /* Admin view */
        #adminView {
            display: none;
        }

        .account-list {
            display: grid;
            gap: 1rem;
        }

        .account-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .account-info h3 {
            font-size: 1rem;
            margin-bottom: 0.2rem;
            color: var(--accent-color);
        }

        .account-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-family: monospace;
        }

        .status-message {
            margin-top: 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: center;
        }

        .status-success {
            color: var(--secondary-color);
        }

        .status-error {
            color: var(--danger-color);
        }

        .loading {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Login View -->
        <div id="loginView">
            <div class="card">
                <h2>Admin Login</h2>
                <div class="form-group">
                    <input type="password" id="adminPassword" placeholder="Enter APP_PASSWORD">
                </div>
                <button class="btn"
                    style="width: 100%; background: linear-gradient(135deg, var(--accent-color), #9965f4); color: white;"
                    onclick="login()">Unlock Dashboard</button>
                <div id="loginStatus" class="status-message status-error"></div>
            </div>
        </div>

        <!-- Admin View -->
        <div id="adminView">
            <div class="header">
                <h1>🎛️ Firebase Account Manager</h1>
                <a href="/">← Back to Transfer Page</a>
            </div>

            <div class="card">
                <h2>➕ Add New Google Drive Account</h2>
                <p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem;">
                    Run <code>node generate-token.js</code> in your terminal to easily get these credentials!
                </p>

                <div class="form-group">
                    <label>Account Display Name</label>
                    <input type="text" id="accName" placeholder="e.g., My Personal Drive">
                </div>
                <div class="form-group">
                    <label>Client ID</label>
                    <input type="text" id="accClientId" placeholder="xxx.apps.googleusercontent.com">
                </div>
                <div class="form-group">
                    <label>Client Secret</label>
                    <input type="text" id="accClientSecret" placeholder="GOCSPX-xxx">
                </div>
                <div class="form-group">
                    <label>Refresh Token</label>
                    <input type="text" id="accRefreshToken" placeholder="1//xxx">
                </div>
                <button class="btn" onclick="addAccount()">Save Account to Firebase</button>
                <div id="addStatus" class="status-message"></div>
            </div>

            <div class="card">
                <h2>📁 Your Saved Drive Accounts</h2>
                <div id="accountsList" class="account-list">
                    <div class="loading">Loading accounts from Firebase...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let adminToken = '';

        // Login wrapper
        async function login() {
            const pwd = document.getElementById('adminPassword').value;
            if (!pwd) return;

            try {
                const res = await fetch('/api/verify-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pwd })
                });

                const data = await res.json();
                if (data.success) {
                    adminToken = pwd;
                    document.getElementById('loginView').style.display = 'none';
                    document.getElementById('adminView').style.display = 'block';
                    fetchAccounts();
                } else {
                    document.getElementById('loginStatus').textContent = 'Incorrect password.';
                }
            } catch (err) {
                document.getElementById('loginStatus').textContent = 'Server error.';
            }
        }

        document.getElementById('adminPassword').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') login();
        });

        // Fetch Accounts
        async function fetchAccounts() {
            try {
                const res = await fetch('/api/accounts', {
                    headers: { 'x-admin-password': adminToken }
                });
                const data = await res.json();

                const listEl = document.getElementById('accountsList');
                listEl.innerHTML = '';

                if (!data.success) {
                    listEl.innerHTML = `<div class="status-error">Error loading accounts from Firebase.</div>`;
                    return;
                }

                if (data.accounts.length === 0) {
                    listEl.innerHTML = `<div style="text-align: center; color: #8888a0; padding: 1rem;">No accounts found in Database. Add one above!</div>`;
                    return;
                }

                data.accounts.forEach(acc => {
                    const item = document.createElement('div');
                    item.className = 'account-item';
                    item.innerHTML = `
                        <div class="account-info">
                            <h3>${acc.name}</h3>
                            <p>Client ID: ${acc.client_id.substring(0, 15)}...</p>
                        </div>
                        <button class="btn btn-danger" onclick="deleteAccount('${acc.id}', '${acc.name}')">Delete</button>
                    `;
                    listEl.appendChild(item);
                });
            } catch (err) {
                console.error(err);
            }
        }

        // Add Account
        async function addAccount() {
            const name = document.getElementById('accName').value.trim();
            const clientId = document.getElementById('accClientId').value.trim();
            const clientSecret = document.getElementById('accClientSecret').value.trim();
            const refreshToken = document.getElementById('accRefreshToken').value.trim();
            const statusEl = document.getElementById('addStatus');

            if (!name || !clientId || !clientSecret || !refreshToken) {
                statusEl.textContent = 'Please fill out all fields!';
                statusEl.className = 'status-message status-error';
                return;
            }

            statusEl.textContent = 'Saving to Firebase...';
            statusEl.className = 'status-message';

            try {
                const res = await fetch('/api/accounts', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-password': adminToken
                    },
                    body: JSON.stringify({
                        name: name,
                        client_id: clientId,
                        client_secret: clientSecret,
                        refresh_token: refreshToken
                    })
                });

                const data = await res.json();
                if (data.success) {
                    statusEl.textContent = 'Account successfully saved to Firebase!';
                    statusEl.className = 'status-message status-success';

                    // Clear inputs
                    document.getElementById('accName').value = '';
                    document.getElementById('accClientId').value = '';
                    document.getElementById('accClientSecret').value = '';
                    document.getElementById('accRefreshToken').value = '';

                    fetchAccounts();
                    setTimeout(() => { statusEl.textContent = ''; }, 3000);
                } else {
                    statusEl.textContent = 'Error: ' + data.error;
                    statusEl.className = 'status-message status-error';
                }
            } catch (err) {
                statusEl.textContent = 'Network Error.';
                statusEl.className = 'status-message status-error';
            }
        }

        // Delete Account
        async function deleteAccount(id, name) {
            if (!confirm(`Are you sure you want to delete "${name}" from your Firebase Database?`)) {
                return;
            }

            try {
                const res = await fetch(`/api/accounts/${id}`, {
                    method: 'DELETE',
                    headers: { 'x-admin-password': adminToken }
                });
                const data = await res.json();

                if (data.success) {
                    fetchAccounts();
                } else {
                    alert('Error deleting account: ' + data.error);
                }
            } catch (err) {
                alert('Network error while deleting account.');
            }
        }
    </script>
</body>

</html>
